name: Daily Stock Analysis

on:
  schedule:
    # cron 按 UTC 计。GitHub 免费 runner 的 schedule 实测延迟 6.5~9h，
    # 故 UTC 15:00(周日~周四) 实际落在北京 05:30~08:00(周一~周五清晨，盘前)。
    # 好处：无论延迟大小，运行都落在北京 23:00~08:00 之间，早上看必是当天数据。
    # 周日~周四 → 北京周一~周五（0=周日，4=周四）。
    - cron: '0 15 * * 0-4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - watchpool-only

permissions:
  contents: write
  pages: write
  actions: write

env:
  # runner 默认 UTC；强制北京时间，使数据日期与 A 股交易日一致
  TZ: Asia/Shanghai

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests pandas efinance json-repair

      - name: Screener data
        if: github.event.inputs.mode != 'watchpool-only'
        run: python3 scripts/daily_stock_screener_ga.py

      - name: Catalyst scan
        if: github.event.inputs.mode != 'watchpool-only'
        run: python3 scripts/catalyst_scanner.py --verbose

      - name: Generate candidates
        if: github.event.inputs.mode != 'watchpool-only'
        run: python3 scripts/generate_candidates.py --verbose

      - name: Feedback
        if: github.event.inputs.mode != 'watchpool-only'
        run: python3 scripts/generate_feedback.py || true

      - name: AI integration
        if: github.event.inputs.mode != 'watchpool-only'
        env:
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
        run: python3 scripts/ai_analyst.py

      - name: Generate picks
        if: github.event.inputs.mode != 'watchpool-only' && success()
        run: python3 scripts/ga_picks_writer.py

      - name: Auto watchlist
        if: github.event.inputs.mode != 'watchpool-only' && success()
        run: python3 scripts/auto_watchlist.py

      - name: Watch pool
        if: always()
        run: python3 scripts/watcher.py

      - name: Push
        if: always()
        run: |
          git config user.name "Stock Bot"
          git config user.email "bot@liuxigreen.github.io"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          DATE=$(date +%Y-%m-%d)
          # 先提交本地新生成的数据
          git commit -m "chore: daily stock analysis $DATE"
          # 与远端合并：docs/data 每次重新生成，冲突时以本地为准（-X ours）
          # 不要用 git stash pop —— 冲突时会写入 <<<<<<< 标记污染 JSON
          for i in 1 2 3; do
            git pull --no-rebase -X ours origin main && break
            echo "⚠️ pull 失败，第 $i 次重试"; sleep 5
          done
          # 防御：绝不推送含 git 冲突标记的数据文件
          if grep -rl '<<<<<<<' docs/data/ 2>/dev/null; then
            echo "❌ docs/data 含冲突标记，中止推送"; exit 1
          fi
          git push origin main
          echo "Done"

      - name: Trigger Pages deploy
        if: always()
        run: |
          curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"ref":"main"}' && echo "Pages deploy triggered" || echo "Pages deploy trigger failed (non-blocking)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ 每日选股分析失败，详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
